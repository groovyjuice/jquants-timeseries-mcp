name: Video Pipeline

on:
  workflow_dispatch:
    inputs:
      project_key:
        description: "Project key used for artifact naming"
        required: true
        type: string
      video_plan_file_id:
        description: "Google Drive file ID for 01_script/video_plan.json"
        required: true
        type: string
      slides_folder_id:
        description: "Google Drive folder ID for 02_slides"
        required: true
        type: string
      audio_folder_id:
        description: "Google Drive folder ID for 03_audio"
        required: true
        type: string
      audio_manifest_file_id:
        description: "Google Drive file ID for 03_audio/manifest.json"
        required: true
        type: string
      ending_slide_file_id:
        description: "Google Drive file ID for common ending slide"
        required: true
        type: string
      output_filename:
        description: "Internal output filename"
        required: false
        default: "project-output.mp4"
        type: string
      segment_count:
        description: "Parallel Remotion segment count"
        required: false
        default: "12"
        type: string
  workflow_call:
    inputs:
      project_key:
        required: true
        type: string
      video_plan_file_id:
        required: true
        type: string
      slides_folder_id:
        required: true
        type: string
      audio_folder_id:
        required: true
        type: string
      audio_manifest_file_id:
        required: true
        type: string
      ending_slide_file_id:
        required: true
        type: string
      output_filename:
        required: false
        default: "project-output.mp4"
        type: string
      segment_count:
        required: false
        default: "12"
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      segments: ${{ steps.matrix.outputs.segments }}
      segment_count: ${{ steps.matrix.outputs.segment_count }}
    env:
      PIPELINE_WORKER_MODE: "1"
      PIPELINE_DRIVE_PROJECT: "1"
      PIPELINE_PACKAGE_ONLY: "1"
      AUTO_PROJECT_USE_FINAL_AUDIO: "1"
      AUTO_PROJECT_VIDEO_PLAN_FILE_ID: ${{ inputs.video_plan_file_id }}
      AUTO_PROJECT_SLIDES_FOLDER_ID: ${{ inputs.slides_folder_id }}
      AUTO_PROJECT_ENDING_SLIDE_FILE_ID: ${{ inputs.ending_slide_file_id }}
      AUTO_PROJECT_AUDIO_FOLDER_ID: ${{ inputs.audio_folder_id }}
      AUTO_PROJECT_AUDIO_MANIFEST_FILE_ID: ${{ inputs.audio_manifest_file_id }}
      AUTO_PROJECT_OUTPUT_FILENAME: ${{ inputs.output_filename }}
      PIPELINE_REPO_PROJECT: "0"
      PIPELINE_REPO_SPRITE: "0"
      PIPELINE_USE_BUNDLED_PROJECT: "0"
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ALLOW_SUBTITLE_FALLBACK: "1"

    steps:
      - name: Checkout render code
        uses: actions/checkout@v4
        with:
          ref: remotion-prototype

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build render matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          COUNT="${{ inputs.segment_count }}"
          python - "$COUNT" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          count = int(sys.argv[1])
          if not 1 <= count <= 24:
              raise SystemExit("segment_count must be between 1 and 24")
          print("segments=" + json.dumps(list(range(count)), separators=(",", ":")))
          print("segment_count=" + str(count))
          PY

      - name: Verify Google Drive authentication configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "Google Drive auth: service account"
          elif [ -n "${GOOGLE_CLIENT_ID:-}" ] && [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && [ -n "${GOOGLE_REFRESH_TOKEN:-}" ]; then
            echo "Google Drive auth: OAuth refresh token"
          else
            echo "Google Drive authentication is not configured." >&2
            echo "Set GOOGLE_SERVICE_ACCOUNT_JSON, or GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET + GOOGLE_REFRESH_TOKEN, in GitHub Actions Secrets." >&2
            exit 1
          fi

      - name: Cache npm download directory
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('remotion-video/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        working-directory: remotion-video
        run: npm install --ignore-scripts --prefer-offline

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Build synchronized render package directly from Google Drive
        working-directory: remotion-video
        run: node server.mjs

      - name: Verify package contents
        working-directory: remotion-video
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="out/render-package.tar.gz"
          test -f "$PACKAGE"
          test "$(stat -c%s "$PACKAGE")" -gt 1000000
          gzip -t "$PACKAGE"
          tar -tzf "$PACKAGE" > out/render-package-list.txt
          grep -Fxq './props.json' out/render-package-list.txt
          grep -Fxq './publish/publish_metadata.json' out/render-package-list.txt
          grep -q '^./public/generated/' out/render-package-list.txt
          echo "render_package_bytes=$(stat -c%s "$PACKAGE")"

      - name: Upload verified package once
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-render-package
          path: remotion-video/out/render-package.tar.gz
          retention-days: 2
          compression-level: 0

  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        segment: ${{ fromJSON(needs.prepare.outputs.segments) }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout render code
        uses: actions/checkout@v4
        with:
          ref: remotion-prototype

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm download directory
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('remotion-video/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies without demos
        working-directory: remotion-video
        run: npm install --ignore-scripts --prefer-offline

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download prepared package
        uses: actions/download-artifact@v4
        with:
          name: pipeline-render-package
          path: .

      - name: Extract assets
        run: tar -xzf render-package.tar.gz -C remotion-video

      - name: Build segment props
        working-directory: remotion-video
        run: |
          node segment-props.mjs props.json "${{ matrix.segment }}" "${{ needs.prepare.outputs.segment_count }}" segment-props.json

      - name: Render segment
        working-directory: remotion-video
        shell: bash
        run: |
          set -euo pipefail
          N=$(printf "%02d" $((${{ matrix.segment }} + 1)))
          mkdir -p out
          npx remotion render src/index.tsx TestVideo "out/segment-${N}-raw.mp4"             --codec=h264             --concurrency=2             --props=segment-props.json

      - name: Encode segment in quality mode
        working-directory: remotion-video
        shell: bash
        run: |
          set -euo pipefail
          N=$(printf "%02d" $((${{ matrix.segment }} + 1)))
          ffmpeg -y -i "out/segment-${N}-raw.mp4"             -c:v libx264 -preset medium -crf 19             -pix_fmt yuv420p             -c:a aac -b:a 128k             -movflags +faststart             "out/segment-${N}.mp4"
          rm -f "out/segment-${N}-raw.mp4"
          ffprobe -v error "out/segment-${N}.mp4" >/dev/null

      - name: Upload compressed segment
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-segment-${{ matrix.segment }}
          path: remotion-video/out/segment-*.mp4
          retention-days: 2
          compression-level: 0

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
      YOUTUBE_CATEGORY_ID: "25"
      YOUTUBE_DRAFT_TITLE: "【下書き】タイトルを設定してください"

    steps:
      - name: Checkout common assets
        uses: actions/checkout@v4
        with:
          ref: remotion-prototype

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install upload dependencies
        working-directory: remotion-video
        run: npm install --ignore-scripts --prefer-offline

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download all compressed segments
        uses: actions/download-artifact@v4
        with:
          pattern: pipeline-segment-*
          path: segments
          merge-multiple: true

      - name: Download render package for publish files
        uses: actions/download-artifact@v4
        with:
          name: pipeline-render-package
          path: package

      - name: Extract publish metadata
        run: |
          mkdir -p publish
          tar -xzf package/render-package.tar.gz -C publish ./publish
          mv publish/publish/* publish/
          rmdir publish/publish

      - name: Verify and concatenate segments
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ needs.prepare.outputs.segment_count }}"
          COUNT=$(find segments -maxdepth 1 -name 'segment-*.mp4' | wc -l)
          echo "segment_count=$COUNT expected=$EXPECTED"
          test "$COUNT" -eq "$EXPECTED"
          : > concat.txt
          while IFS= read -r f; do
            ffprobe -v error "$f" >/dev/null
            echo "file '$PWD/$f'" >> concat.txt
          done < <(find segments -maxdepth 1 -name 'segment-*.mp4' | sort)
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy narration-video.mp4

      - name: Mix BGM and normalize loudness
        shell: bash
        run: |
          set -euo pipefail
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 narration-video.mp4)
          FADE_OUT_START=$(awk -v d="$DURATION" 'BEGIN {x=d-1.5; if(x<0)x=0; printf "%.3f", x}')
          BGM="remotion-video/public/common/bgm/main_bgm.mp3"
          test -f "$BGM"

          ffmpeg -y             -i narration-video.mp4             -stream_loop -1 -i "$BGM"             -filter_complex "[1:a]volume=0.025,afade=t=in:st=0:d=1,afade=t=out:st=${FADE_OUT_START}:d=1.5[bgm];[0:a][bgm]amix=inputs=2:duration=first:dropout_transition=0[mix];[mix]loudnorm=I=-15:LRA=7:TP=-1[a]"             -map 0:v:0 -map "[a]"             -c:v copy -c:a aac -b:a 128k -ar 48000 -ac 2 -shortest             -movflags +faststart             final_video.mp4

      - name: Verify final media and full decode
        shell: bash
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s final_video.mp4)
          echo "bytes=$SIZE"
          test "$SIZE" -gt 1000000

          ffprobe -v error             -show_entries format=duration,size,bit_rate             -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels             -of json final_video.mp4 > publish/media_info.json

          python - <<'PY'
          import json
          data=json.load(open("publish/media_info.json",encoding="utf-8"))
          streams=data.get("streams",[])
          v=next((s for s in streams if s.get("codec_type")=="video"),None)
          a=next((s for s in streams if s.get("codec_type")=="audio"),None)
          assert v, "video stream missing"
          assert a, "audio stream missing"
          assert v.get("codec_name")=="h264", v
          assert (v.get("width"),v.get("height"))==(1920,1080), v
          rate=v.get("r_frame_rate") or v.get("avg_frame_rate","0/1")
          num,den=map(float,rate.split("/"))
          fps=num/den if den else 0
          assert 29.9 <= fps <= 30.1, v
          assert a.get("codec_name")=="aac", a
          assert str(a.get("sample_rate"))=="48000", a
          assert int(a.get("channels",0))==2, a
          print("media stream QA passed")
          PY

          ffmpeg -v error -i final_video.mp4 -f null - 2> publish/decode-errors.txt
          test ! -s publish/decode-errors.txt

      - name: Measure loudness
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -i final_video.mp4             -af loudnorm=I=-15:LRA=7:TP=-1:print_format=json             -f null - 2> loudness.txt || true

          python - <<'PY'
          import json,re
          text=open("loudness.txt",encoding="utf-8",errors="ignore").read()
          matches=re.findall(r'\{\s*"input_i".*?\}',text,re.S)
          if not matches:
              raise SystemExit("Could not parse loudness measurement")
          data=json.loads(matches[-1])
          i=float(data["input_i"])
          tp=float(data["input_tp"])
          with open("publish/loudness.txt","w",encoding="utf-8") as f:
              f.write(f"integrated_lufs={i}\ntrue_peak_dbtp={tp}\n")
          if not (-16.0 <= i <= -14.0):
              raise SystemExit(f"Integrated loudness out of range: {i}")
          if tp > -0.5:
              raise SystemExit(f"True peak too high: {tp}")
          print(f"loudness QA passed: I={i}, TP={tp}")
          PY

      - name: Require Upload-Post credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPLOAD_POST_API_KEY"
          test -n "$UPLOAD_POST_USER"

      - name: Upload private draft to YouTube
        shell: bash
        run: |
          set -euo pipefail
          node remotion-video/upload-post-youtube.mjs             final_video.mp4             publish/publish_metadata.json             publish/youtube_upload.json

      - name: Verify YouTube draft result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          data=json.load(open("publish/youtube_upload.json",encoding="utf-8"))
          assert data["video_id"], "Missing YouTube video id"
          assert data["privacy_status"]=="private", data
          assert data["description_set"] is True, data
          assert data["tag_count"]>0, data
          print("video_id="+data["video_id"])
          print("studio_edit_url="+data["studio_edit_url"])
          PY

      - name: Assemble delivery folder
        shell: bash
        run: |
          mkdir -p delivery
          mv final_video.mp4 delivery/
          cp -r publish/* delivery/

      - name: Upload complete delivery package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_key }}-delivery
          path: delivery/
          retention-days: 7
          compression-level: 0
