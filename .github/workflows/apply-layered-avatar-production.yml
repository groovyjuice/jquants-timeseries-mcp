name: Apply Layered Avatar Production

on:
  push:
    branches:
      - remotion-prototype
    paths:
      - '.github/workflows/apply-layered-avatar-production.yml'

permissions:
  contents: write

jobs:
  patch-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: remotion-prototype
          fetch-depth: 0

      - name: Apply production avatar integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          p = Path('remotion-video/src/scenes.ts')
          text = read(p)
          pose_line = "  pose?: 'normal' | 'point_up' | 'caution' | 'positive' | 'explain';\n"
          if pose_line not in text:
              needle = "  emotion: 'normal' | 'surprise' | 'serious' | 'smile';\n"
              assert needle in text
              text = text.replace(needle, needle + pose_line, 1)
              write(p, text)

          p = Path('remotion-video/src/Video.tsx')
          text = read(p)
          import_line = "import {LayeredAvatar} from './LayeredAvatar';\n"
          if import_line not in text:
              needle = "} from './scenes';\n"
              assert needle in text
              text = text.replace(needle, needle + import_line, 1)

          old = "          <Avatar emotion={scene.emotion} mouthCues={scene.mouthCues} />"
          new = """          <div\n            style={{\n              position: 'absolute',\n              left: 10,\n              bottom: 18,\n              width: 460,\n              height: 460,\n            }}\n          >\n            <LayeredAvatar\n              pose={scene.pose ?? 'normal'}\n              emotion={scene.emotion}\n              mouthCues={scene.mouthCues}\n              size={460}\n              bobAmount={2.2}\n              enableBlink\n              showShadow\n            />\n          </div>"""
          if old in text:
              text = text.replace(old, new, 1)
          elif "<LayeredAvatar" not in text:
              raise AssertionError('production Avatar call not found')
          write(p, text)

          p = Path('remotion-video/project.mjs')
          text = read(p)
          valid_pose_decl = "const validPoses = new Set(['normal', 'point_up', 'caution', 'positive', 'explain']);\n"
          if valid_pose_decl not in text:
              needle = "const validEmotions = new Set(['normal', 'surprise', 'serious', 'smile']);\n"
              assert needle in text
              text = text.replace(needle, needle + valid_pose_decl, 1)
          emotion_line = "      emotion: validEmotions.has(slide.emotion) ? slide.emotion : 'normal',\n"
          pose_map_line = "      pose: validPoses.has(slide.pose) ? slide.pose : 'normal',\n"
          if pose_map_line not in text:
              assert text.count(emotion_line) >= 1
              text = text.replace(emotion_line, emotion_line + pose_map_line)
          write(p, text)

          p = Path('remotion-video/server.mjs')
          text = read(p)
          pose_validation = """    if (\n      scene.pose !== undefined &&\n      !['normal', 'point_up', 'caution', 'positive', 'explain'].includes(scene.pose)\n    ) {\n      throw new Error(`Invalid scene pose at index ${index}`);\n    }\n\n"""
          if pose_validation not in text:
              needle = """    if (\n      scene.narration !== undefined &&\n      typeof scene.narration !== 'string'\n    ) {\n      throw new Error(`Invalid narration at scene ${index}`);\n    }\n"""
              assert needle in text
              text = text.replace(needle, needle + "\n" + pose_validation, 1)

          character_pack = """  const characterSourceDir = path.join(cwd, 'public', 'characters');\n  const characterTargetDir = path.join(stageDir, 'public', 'characters');\n  await stat(characterSourceDir);\n  await cp(characterSourceDir, characterTargetDir, {recursive: true});\n\n"""
          if character_pack not in text:
              needle = "  await mkdir(path.join(stageDir, 'public', 'generated'), {recursive: true});\n\n"
              assert needle in text
              text = text.replace(needle, needle + character_pack, 1)
          write(p, text)
          PY

      - name: Verify patch markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "pose={scene.pose ?? 'normal'}" remotion-video/src/Video.tsx
          grep -Fq "mouth_smile_half.png" remotion-video/src/LayeredAvatar.tsx
          grep -Fq "pose: validPoses.has(slide.pose)" remotion-video/project.mjs
          grep -Fq "characterSourceDir" remotion-video/server.mjs

      - name: Remotion bundle check
        working-directory: remotion-video
        run: |
          npm install --ignore-scripts --prefer-offline
          npx remotion compositions src/index.tsx

      - name: Commit production code integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add remotion-video/src/scenes.ts remotion-video/src/Video.tsx remotion-video/project.mjs remotion-video/server.mjs
          git diff --cached --check
          git commit -m 'Use layered avatar in production videos'
          git push origin HEAD:remotion-prototype
