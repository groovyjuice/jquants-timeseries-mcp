name: Apply Layered Avatar Production

on:
  push:
    branches:
      - remotion-prototype
    paths:
      - '.github/workflows/apply-layered-avatar-production.yml'

permissions:
  contents: write

jobs:
  patch-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: remotion-prototype
          fetch-depth: 0

      - name: Make server fetch character assets for production package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('remotion-video/server.mjs')
          text = p.read_text(encoding='utf-8')

          old_import = "import {readGoogleDocText} from './drive.mjs';"
          new_import = "import {readGoogleDocText, downloadDriveFile, listDriveFolderFiles} from './drive.mjs';"
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise AssertionError('drive.mjs import not found')

          helper = r'''const PRODUCTION_CHARACTER_ASSETS = [
  'body_normal.png',
  'body_point_up.png',
  'body_caution.png',
  'body_positive.png',
  'body_explain.png',
  'head_base.png',
  'hair_back.png',
  'hair_front.png',
  'eyebrow_normal.png',
  'eyebrow_serious.png',
  'eyebrow_surprise.png',
  'eyebrow_smile.png',
  'eyes_open.png',
  'eyes_closed.png',
  'eyes_surprise.png',
  'eyes_smile.png',
  'pupil_left.png',
  'pupil_right.png',
  'mouth_closed.png',
  'mouth_half.png',
  'mouth_open.png',
  'mouth_smile_closed.png',
  'mouth_smile_half.png',
  'mouth_smile_open.png',
];

const prepareProductionCharacterAssets = async () => {
  const folderId =
    process.env.CHARACTERS_DRIVE_FOLDER_ID ||
    '1ucqNuaEwnAumEXYnzb3PRP2-fVzJpE6g';
  const outputDir = path.join(cwd, 'public', 'characters');

  await rm(outputDir, {recursive: true, force: true});
  await mkdir(outputDir, {recursive: true});

  const files = await listDriveFolderFiles(folderId);
  const byName = new Map();
  for (const file of files) {
    if (!file?.name) continue;
    if (byName.has(file.name)) {
      throw new Error(`Duplicate production character asset: ${file.name}`);
    }
    byName.set(file.name, file);
  }

  const missing = PRODUCTION_CHARACTER_ASSETS.filter(
    (name) => !byName.has(name),
  );
  if (missing.length) {
    throw new Error(
      `Missing production character assets in Drive folder ${folderId}: ${missing.join(', ')}`,
    );
  }

  for (const name of PRODUCTION_CHARACTER_ASSETS) {
    const file = byName.get(name);
    const outputPath = path.join(outputDir, name);
    await downloadDriveFile({fileId: file.id, outputPath});
    const info = await stat(outputPath);
    if (info.size <= 0) {
      throw new Error(`Downloaded empty production character asset: ${name}`);
    }
  }

  console.log(
    `Production character assets ready: ${PRODUCTION_CHARACTER_ASSETS.length}/24 from Drive folder ${folderId}`,
  );
};

'''
          marker = "const validateProps = (props) => {"
          if "const prepareProductionCharacterAssets = async () =>" not in text:
              assert marker in text, 'validateProps marker not found'
              text = text.replace(marker, helper + marker, 1)

          call = "    await prepareProductionCharacterAssets();\n"
          package_marker = "    await createRenderPackage({\n"
          if call not in text:
              assert package_marker in text, 'createRenderPackage call not found'
              text = text.replace(
                  package_marker,
                  "    console.log('Auto project render: downloading canonical 24-part character assets from Drive');\n" + call + package_marker,
                  1,
              )

          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify production character fetch markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "prepareProductionCharacterAssets" remotion-video/server.mjs
          grep -Fq "mouth_smile_half.png" remotion-video/server.mjs
          grep -Fq "1ucqNuaEwnAumEXYnzb3PRP2-fVzJpE6g" remotion-video/server.mjs
          grep -Fq "characterSourceDir" remotion-video/server.mjs

      - name: Remotion bundle check
        working-directory: remotion-video
        run: |
          npm install --ignore-scripts --prefer-offline
          npx remotion compositions src/index.tsx

      - name: Commit production character fetch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add remotion-video/server.mjs
          git diff --cached --check
          git commit -m 'Fetch layered avatar assets for production renders'
          git push origin HEAD:remotion-prototype
