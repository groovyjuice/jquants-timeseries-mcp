name: Recover Hormuz - Direct YouTube

on:
  push:
    branches:
      - remotion-prototype
    paths:
      - ".github/workflows/recover-hormuz-youtube-direct.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CATEGORY_ID: "25"
      YOUTUBE_DRAFT_TITLE: "【下書き】タイトルを設定してください"
      SOURCE_RUN_ID: "34494773093"
      PROJECT_KEY: "hormuz-oil-rates-20260910"

    steps:
      - name: Checkout current direct-upload code
        uses: actions/checkout@v4
        with:
          ref: remotion-prototype

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: remotion-video
        run: npm install --ignore-scripts --prefer-offline

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download existing rendered segments
        uses: actions/download-artifact@v4
        with:
          pattern: pipeline-segment-*
          path: segments
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: groovyjuice/jquants-timeseries-mcp
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download existing render package
        uses: actions/download-artifact@v4
        with:
          name: pipeline-render-package
          path: package
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: groovyjuice/jquants-timeseries-mcp
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Extract publish metadata
        run: |
          set -euo pipefail
          mkdir -p publish
          tar -xzf package/render-package.tar.gz -C publish ./publish
          mv publish/publish/* publish/
          rmdir publish/publish
          test -s publish/publish_metadata.json

      - name: Verify and concatenate 12 existing segments
        shell: bash
        run: |
          set -euo pipefail
          COUNT=$(find segments -maxdepth 1 -name 'segment-*.mp4' | wc -l)
          echo "segment_count=$COUNT expected=12"
          test "$COUNT" -eq 12
          : > concat.txt
          while IFS= read -r f; do
            ffprobe -v error "$f" >/dev/null
            echo "file '$PWD/$f'" >> concat.txt
          done < <(find segments -maxdepth 1 -name 'segment-*.mp4' | sort)
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy narration-video.mp4

      - name: Mix BGM and normalize loudness
        shell: bash
        run: |
          set -euo pipefail
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 narration-video.mp4)
          FADE_OUT_START=$(awk -v d="$DURATION" 'BEGIN {x=d-1.5; if(x<0)x=0; printf "%.3f", x}')
          BGM="remotion-video/public/common/bgm/main_bgm.mp3"
          test -f "$BGM"
          ffmpeg -y \
            -i narration-video.mp4 \
            -stream_loop -1 -i "$BGM" \
            -filter_complex "[1:a]volume=0.025,afade=t=in:st=0:d=1,afade=t=out:st=${FADE_OUT_START}:d=1.5[bgm];[0:a][bgm]amix=inputs=2:duration=first:dropout_transition=0[mix];[mix]loudnorm=I=-15:LRA=7:TP=-1.5[a]" \
            -map 0:v:0 -map "[a]" \
            -c:v copy -c:a aac -b:a 128k -ar 48000 -ac 2 -shortest \
            -movflags +faststart \
            final_video.mp4

      - name: Verify final media and full decode
        shell: bash
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s final_video.mp4)
          echo "bytes=$SIZE"
          test "$SIZE" -gt 1000000
          ffprobe -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels \
            -of json final_video.mp4 > publish/media_info.json
          python - <<'PY'
          import json
          data=json.load(open("publish/media_info.json",encoding="utf-8"))
          streams=data.get("streams",[])
          v=next((s for s in streams if s.get("codec_type")=="video"),None)
          a=next((s for s in streams if s.get("codec_type")=="audio"),None)
          assert v and a
          assert v.get("codec_name")=="h264", v
          assert (v.get("width"),v.get("height"))==(1920,1080), v
          rate=v.get("r_frame_rate") or v.get("avg_frame_rate","0/1")
          num,den=map(float,rate.split("/"))
          fps=num/den if den else 0
          assert 29.9 <= fps <= 30.1, v
          assert a.get("codec_name")=="aac", a
          assert str(a.get("sample_rate"))=="48000", a
          assert int(a.get("channels",0))==2, a
          print("media stream QA passed")
          PY
          ffmpeg -v error -i final_video.mp4 -f null - 2> publish/decode-errors.txt
          test ! -s publish/decode-errors.txt

      - name: Measure loudness
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -i final_video.mp4 \
            -af loudnorm=I=-15:LRA=7:TP=-1:print_format=json \
            -f null - 2> loudness.txt || true
          python - <<'PY'
          import json,re
          text=open("loudness.txt",encoding="utf-8",errors="ignore").read()
          matches=re.findall(r'\{\s*"input_i".*?\}',text,re.S)
          if not matches:
              raise SystemExit("Could not parse loudness measurement")
          data=json.loads(matches[-1])
          i=float(data["input_i"])
          tp=float(data["input_tp"])
          with open("publish/loudness.txt","w",encoding="utf-8") as f:
              f.write(f"integrated_lufs={i}\ntrue_peak_dbtp={tp}\n")
          if not (-16.0 <= i <= -14.0):
              raise SystemExit(f"Integrated loudness out of range: {i}")
          if tp > -1.0:
              raise SystemExit(f"True peak too high: {tp}")
          print(f"loudness QA passed: I={i}, TP={tp}")
          PY

      - name: Save completed MP4 before external upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-ready
          cp final_video.mp4 final-ready/
          cp -r publish final-ready/

      - name: Upload final-ready artifact
        uses: actions/upload-artifact@v4
        with:
          name: hormuz-oil-rates-20260910-final-ready
          path: final-ready/
          retention-days: 7
          compression-level: 0

      - name: Verify YouTube OAuth before upload
        run: node remotion-video/youtube-oauth-check.mjs

      - name: Upload private draft directly to YouTube Data API
        shell: bash
        run: |
          set -euo pipefail
          node remotion-video/youtube-direct-upload.mjs \
            final_video.mp4 \
            publish/publish_metadata.json \
            publish/youtube_upload.json

      - name: Verify YouTube draft result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          data=json.load(open("publish/youtube_upload.json",encoding="utf-8"))
          assert data["provider"]=="youtube-data-api", data
          assert data["video_id"], "Missing YouTube video id"
          assert data["privacy_status"]=="private", data
          assert data["description_set"] is True, data
          assert data["tag_count"]>0, data
          print("video_id="+data["video_id"])
          print("studio_edit_url="+data["studio_edit_url"])
          PY

      - name: Upload delivery metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: hormuz-oil-rates-20260910-delivery
          path: publish/
          retention-days: 7
          compression-level: 0
