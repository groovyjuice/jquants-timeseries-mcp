name: Patch Section Title Fullscreen 20260912

on:
  push:
    branches:
      - remotion-prototype
    paths:
      - ".github/workflows/patch-section-title-fullscreen-20260912.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PATCH_SCRIPT_B64: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remotion-prototype

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch section title layout
        shell: bash
        run: |
          set -euo pipefail
          echo "$PATCH_SCRIPT_B64" | base64 -d > /tmp/patch_section_title.py
          python /tmp/patch_section_title.py

      - name: Verify patch markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const isSectionTitle = scene.slideType === 'section_title';" remotion-video/src/Video.tsx
          grep -Fq "width: isSectionTitle ? 1920 : SLIDE_WIDTH" remotion-video/src/Video.tsx
          grep -Fq "height: isSectionTitle ? 1080 : CONTENT_HEIGHT" remotion-video/src/Video.tsx
          grep -Fq "{!isSectionTitle ? (" remotion-video/src/Video.tsx

      - name: Install dependencies
        working-directory: remotion-video
        run: npm install --ignore-scripts --prefer-offline

      - name: Compile Remotion compositions
        working-directory: remotion-video
        run: npx remotion compositions src/index.tsx

      - name: Commit Video.tsx
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remotion-video/src/Video.tsx
          git diff --cached --check
          git commit -m "Show section title slides fullscreen"
          git push origin HEAD:remotion-prototype
