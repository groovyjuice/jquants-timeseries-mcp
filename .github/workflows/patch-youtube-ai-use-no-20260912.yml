name: Patch YouTube AI Use No 20260912

on:
  push:
    branches:
      - remotion-prototype
    paths:
      - ".github/workflows/patch-youtube-ai-use-no-20260912.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remotion-prototype

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set AI use disclosure default to No
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          uploader = Path('remotion-video/youtube-direct-upload.mjs')
          text = uploader.read_text(encoding='utf-8')
          old = '        containsSyntheticMedia: true,'
          new = '        containsSyntheticMedia: false,'
          if text.count(old) != 1:
              raise SystemExit(f'uploader expected 1 true setting, got {text.count(old)}')
          uploader.write_text(text.replace(old, new, 1), encoding='utf-8')

          changed = []
          for p in Path('.github/workflows').glob('*.yml'):
              t = p.read_text(encoding='utf-8')
              nt = t.replace('assert data["contains_synthetic_media"] is True, data', 'assert data["contains_synthetic_media"] is False, data')
              if nt != t:
                  p.write_text(nt, encoding='utf-8')
                  changed.append(str(p))

          print('patched uploader and workflow assertions')
          for p in changed:
              print('updated', p)
          PY

      - name: Verify syntax and settings
        shell: bash
        run: |
          set -euo pipefail
          node --check remotion-video/youtube-direct-upload.mjs
          grep -Fq 'containsSyntheticMedia: false' remotion-video/youtube-direct-upload.mjs
          ! grep -R -F 'assert data["contains_synthetic_media"] is True, data' .github/workflows --include='*.yml'
          grep -Fq 'assert data["contains_synthetic_media"] is False, data' .github/workflows/video-pipeline-youtube-direct.yml
          echo 'AI use default No verification passed'

      - name: Commit standard change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remotion-video/youtube-direct-upload.mjs .github/workflows
          git diff --cached --check
          git commit -m "Default YouTube AI use disclosure to no"
          git push origin HEAD:remotion-prototype
