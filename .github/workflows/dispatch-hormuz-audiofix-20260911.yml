name: Dispatch Hormuz Audio Fix 20260911

on:
  push:
    branches:
      - remotion-prototype
    paths:
      - '.github/workflows/dispatch-hormuz-audiofix-20260911.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch direct YouTube video pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/video-pipeline-youtube-direct.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "remotion-prototype",
            "inputs": {
              "project_key": "hormuz-oil-rates-20260910-audiofix-20260911",
              "video_plan_file_id": "1KeT6lZOrjS8qGGHHWi6mluywhp5_N2fK",
