name: Patch YouTube Description Blog Block 20260912

on:
  push:
    branches:
      - remotion-prototype
    paths:
      - ".github/workflows/patch-youtube-description-blog-block-20260912.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remotion-prototype

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch YouTube description layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('remotion-video/publish-metadata.mjs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              text = text.replace(old, new, 1)

          anchor = "const CHANNEL_BOILERPLATE = `ようこそ「賢明なる投資家チャンネル」へ。"
          if anchor not in text:
              raise SystemExit('channel boilerplate anchor not found')
          blog_const = """const BLOG_ARTICLE_BLOCK = `▼今日の動画のポイント記事（ブログ）\n動画の内容を文字と図解でじっくり復習したい方はこちら\nhttps://kenmeitoushika.com/archives/xxxx`;\n\n"""
          text = text.replace(anchor, blog_const + anchor, 1)

          helper_anchor = "const formatChapterTimestamp = (seconds) => {"
          if helper_anchor not in text:
              raise SystemExit('format chapter helper anchor not found')
          hashtag_helper = r'''const buildDescriptionHashtags = ({tags, plan}) => {
  const securityCode = normalizeSecurityCode(plan);
  const securityName = normalizeSecurityName(plan);
  const candidates = [
    securityName,
    securityCode,
    ...(Array.isArray(tags) ? tags : []),
    securityCode ? '日本株' : '投資',
    '株式投資',
  ];

  const result = [];
  for (const raw of candidates) {
    const normalized = normalizeTag(raw)
      .replace(/\s+/g, '')
      .replace(/[^0-9A-Za-z\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}ー]/gu, '');
    if (!normalized || normalized.length > 40) continue;
    if (normalized === '賢明なる投資家チャンネル') continue;
    const hashtag = `#${normalized}`;
    if (!result.includes(hashtag)) result.push(hashtag);
    if (result.length >= 5) break;
  }
  return result;
};

'''
          text = text.replace(helper_anchor, hashtag_helper + helper_anchor, 1)

          old_apply = """  const descriptionParts = [metadata.description_intro];

  if (keyPointText) {
    descriptionParts.push('', '【今回のポイント】', keyPointText);
  }

  if (chapters.length >= 3) {
    descriptionParts.push('', '【目次】', chapterText);
  }

  if (metadata.description_closing) {
    descriptionParts.push('', metadata.description_closing);
  }

  descriptionParts.push('', CHANNEL_BOILERPLATE);
"""
          new_apply = """  const descriptionHashtags = buildDescriptionHashtags({
    tags: metadata.tags,
    plan,
  }).join(' ');

  const descriptionParts = [BLOG_ARTICLE_BLOCK, '', metadata.description_intro];

  if (keyPointText) {
    descriptionParts.push('', '【今回のポイント】', keyPointText);
  }

  if (chapters.length >= 3) {
    descriptionParts.push('', '【目次】', chapterText);
  }

  if (metadata.description_closing) {
    descriptionParts.push('', metadata.description_closing);
  }

  if (descriptionHashtags) {
    descriptionParts.push('', descriptionHashtags);
  }

  descriptionParts.push('', CHANNEL_BOILERPLATE);
"""
          replace_once(old_apply, new_apply, 'chapter-aware description layout')

          old_base = """  const description = [
    generated.description_intro,
    keyPointText ? `\\n【今回のポイント】\\n${keyPointText}` : '',
    generated.description_closing ? `\\n${generated.description_closing}` : '',
    '',
    CHANNEL_BOILERPLATE,
  ]
    .filter((part) => part !== '')
    .join('\\n');
"""
          new_base = """  const descriptionHashtags = buildDescriptionHashtags({
    tags: generated.tags,
    plan,
  }).join(' ');
  const description = [
    BLOG_ARTICLE_BLOCK,
    '',
    generated.description_intro,
    keyPointText ? `\\n【今回のポイント】\\n${keyPointText}` : '',
    generated.description_closing ? `\\n${generated.description_closing}` : '',
    descriptionHashtags ? `\\n${descriptionHashtags}` : '',
    '',
    CHANNEL_BOILERPLATE,
  ]
    .filter((part) => part !== '')
    .join('\\n');
"""
          replace_once(old_base, new_base, 'base description layout')

          old_export = "export {CHANNEL_BOILERPLATE};"
          new_export = "export {BLOG_ARTICLE_BLOCK, CHANNEL_BOILERPLATE};"
          replace_once(old_export, new_export, 'exports')

          path.write_text(text, encoding='utf-8')
          print('publish-metadata.mjs patched')
          PY

      - name: Install dependencies
        working-directory: remotion-video
        run: npm install --ignore-scripts --prefer-offline

      - name: Syntax and behavior test
        shell: bash
        run: |
          set -euo pipefail
          node --check remotion-video/publish-metadata.mjs
          node --input-type=module <<'NODE'
          import {generatePublishMetadata, applyChaptersToPublishMetadata, BLOG_ARTICLE_BLOCK} from './remotion-video/publish-metadata.mjs';

          const plan = {
            video_title: 'メタプラネット 10円SO修正で株価反転なるか',
            topic: '10円SO修正と株価反転条件',
            security_name: 'メタプラネット',
            security_code: '3350',
            slides: [
              {type:'content', section:'導入', display_title:'何が変わったのか', slide_text:['10円SOを大幅修正']},
              {type:'section_title', section:'10円SOの問題と修正', display_title:'10円SOの問題と修正'},
              {type:'content', section:'10円SOの問題と修正', display_title:'潜在株式数を削減', slide_text:['残存潜在株式数を約55.5％削減']},
              {type:'section_title', section:'株価反転材料とPTS', display_title:'株価反転材料とPTS'},
              {type:'content', section:'株価反転材料とPTS', display_title:'PTS反応', slide_text:['PTSは前日比約3.8％上昇']},
              {type:'section_title', section:'株価反転に必要な条件', display_title:'株価反転に必要な条件'},
              {type:'content', section:'株価反転に必要な条件', display_title:'今後の焦点', slide_text:['資本政策とmNAVを確認']},
            ],
          };
          const meta = await generatePublishMetadata({plan});
          const scenes = Array.from({length:7}, (_,i)=>({from:i*900,duration:900}));
          const final = await applyChaptersToPublishMetadata({metadata:meta, plan, scenes, fps:30, totalFrames:6300});
          if (!final.description.startsWith(BLOG_ARTICLE_BLOCK)) throw new Error('blog block is not first');
          const ordered = [
            '▼今日の動画のポイント記事（ブログ）',
            'メタプラネット 10円SO修正で株価反転なるか',
            '【今回のポイント】',
            '【目次】',
            '#メタプラネット',
            'ようこそ「賢明なる投資家チャンネル」へ。',
          ];
          let cursor = -1;
          for (const marker of ordered) {
            const idx = final.description.indexOf(marker);
            if (idx < 0 || idx <= cursor) throw new Error(`description order invalid at ${marker}`);
            cursor = idx;
          }
          for (const marker of ['https://kenmeitoushika.com/archives/xxxx','#3350']) {
            if (!final.description.includes(marker)) throw new Error(`missing ${marker}`);
          }
          console.log('blog-first description test passed');
          NODE

      - name: Commit standard change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remotion-video/publish-metadata.mjs
          git diff --cached --check
          git commit -m "Put blog link block first in YouTube descriptions"
          git push origin HEAD:remotion-prototype
