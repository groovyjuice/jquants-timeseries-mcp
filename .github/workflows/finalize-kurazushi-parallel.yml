name: Finalize Kura Sushi Parallel

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/finalize-kurazushi-parallel.yml"

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout BGM asset
        uses: actions/checkout@v4
        with:
          ref: remotion-prototype

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download rendered segments from prior run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34021489153
          pattern: kurazushi-segment-*
          path: segments
          merge-multiple: true

      - name: Verify segments
        shell: bash
        run: |
          set -euo pipefail
          ls -lh segments
          COUNT=$(find segments -maxdepth 1 -name 'segment-*.mp4' | wc -l)
          echo "segment count=$COUNT"
          test "$COUNT" -eq 12
          for f in $(find segments -maxdepth 1 -name 'segment-*.mp4' | sort); do
            ffprobe -v error "$f" >/dev/null
          done

      - name: Concatenate segments
        shell: bash
        run: |
          set -euo pipefail
          : > concat.txt
          for f in $(find segments -maxdepth 1 -name 'segment-*.mp4' | sort); do
            echo "file '$PWD/$f'" >> concat.txt
          done
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy narration-video.mp4

      - name: Mix continuous BGM
        shell: bash
        run: |
          set -euo pipefail
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 narration-video.mp4)
          FADE_OUT_START=$(awk -v d="$DURATION" 'BEGIN {x=d-1.5; if(x<0)x=0; printf "%.3f", x}')
          BGM="remotion-video/public/common/bgm/main_bgm.mp3"

          ffmpeg -y \
            -i narration-video.mp4 \
            -stream_loop -1 -i "$BGM" \
            -filter_complex "[1:a]volume=0.02,afade=t=in:st=0:d=1,afade=t=out:st=${FADE_OUT_START}:d=1.5[bgm];[0:a][bgm]amix=inputs=2:duration=first:dropout_transition=0[a]" \
            -map 0:v:0 -map "[a]" \
            -c:v copy -c:a aac -b:a 320k -shortest \
            kurazushi_chiikawa_full.mp4

      - name: Inspect final output
        run: |
          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            kurazushi_chiikawa_full.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: kurazushi-full-video-final
          path: kurazushi_chiikawa_full.mp4
          retention-days: 7
          compression-level: 0
