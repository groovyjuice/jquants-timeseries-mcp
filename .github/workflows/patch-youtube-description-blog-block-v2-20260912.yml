name: Patch YouTube Description Blog Block V2 20260912

on:
  push:
    branches:
      - remotion-prototype
    paths:
      - ".github/workflows/patch-youtube-description-blog-block-v2-20260912.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remotion-prototype
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Install dependencies
        working-directory: remotion-video
        run: npm install --ignore-scripts --prefer-offline
      - name: Verify behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check remotion-video/publish-metadata.mjs
          node --input-type=module <<'NODE'
          import {generatePublishMetadata, applyChaptersToPublishMetadata, BLOG_ARTICLE_BLOCK} from './remotion-video/publish-metadata.mjs';
          const plan={video_title:'メタプラネット 10円SO修正で株価反転なるか',topic:'10円SO修正と株価反転条件',security_name:'メタプラネット',security_code:'3350',slides:[{type:'content',section:'導入',display_title:'何が変わったのか',slide_text:['10円SOを大幅修正']},{type:'section_title',section:'10円SOの問題と修正',display_title:'10円SOの問題と修正'},{type:'content',section:'10円SOの問題と修正',display_title:'潜在株式数を削減',slide_text:['残存潜在株式数を約55.5％削減']},{type:'section_title',section:'株価反転材料とPTS',display_title:'株価反転材料とPTS'},{type:'content',section:'株価反転材料とPTS',display_title:'PTS反応',slide_text:['PTSは前日比約3.8％上昇']},{type:'section_title',section:'株価反転に必要な条件',display_title:'株価反転に必要な条件'},{type:'content',section:'株価反転に必要な条件',display_title:'今後の焦点',slide_text:['資本政策とmNAVを確認']}]};
          const meta=await generatePublishMetadata({plan});
          const scenes=Array.from({length:7},(_,i)=>({from:i*900,duration:900}));
          const final=await applyChaptersToPublishMetadata({metadata:meta,plan,scenes,fps:30,totalFrames:6300});
          if(!final.description.startsWith(BLOG_ARTICLE_BLOCK)) throw new Error('blog block is not first');
          const ordered=['▼今日の動画のポイント記事（ブログ）','メタプラネット 10円SO修正で株価反転なるか','【今回のポイント】','【目次】','#メタプラネット','ようこそ「賢明なる投資家チャンネル」へ。'];
          let cursor=-1;
          for(const marker of ordered){const idx=final.description.indexOf(marker);if(idx<0||idx<=cursor) throw new Error(`order invalid at ${marker}`);cursor=idx;}
          for(const marker of ['https://kenmeitoushika.com/archives/xxxx','#3350']) if(!final.description.includes(marker)) throw new Error(`missing ${marker}`);
          console.log('blog-first description test passed');
          NODE
      - name: Commit standard change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remotion-video/publish-metadata.mjs
          git diff --cached --check
          git commit -m "Put blog link block first in YouTube descriptions"
          git push origin HEAD:remotion-prototype
