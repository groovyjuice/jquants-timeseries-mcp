name: Export Kioxia 1min

on:
  push:
    paths:
      - ".github/workflows/export-kioxia-1min.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download Kioxia 1-minute CSV
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "JQ_キオクシアホールディングス_1min.csv"             "https://jquants-timeseries-mcp.onrender.com/tmp-kioxia-1min-7b42e5f1"
          test -s "JQ_キオクシアホールディングス_1min.csv"
          head -n 2 "JQ_キオクシアホールディングス_1min.csv"
          wc -l "JQ_キオクシアホールディングス_1min.csv"
      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: kioxia-1min-csv
          path: JQ_キオクシアホールディングス_1min.csv
          if-no-files-found: error
          retention-days: 1

# trigger export
