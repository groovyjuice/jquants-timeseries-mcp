name: Fix DMP 2026-09-10 True Peak

on:
  push:
    branches:
      - remotion-prototype
    paths:
      - '.github/workflows/run-dmp-tpfix-20260910.yml'

jobs:
  fix-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
      YOUTUBE_CATEGORY_ID: "25"
      YOUTUBE_DRAFT_TITLE: "【下書き】タイトルを設定してください"

    steps:
      - name: Checkout upload code
        uses: actions/checkout@v4
        with:
          ref: remotion-prototype

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install upload dependencies
        working-directory: remotion-video
        run: npm install --ignore-scripts --prefer-offline

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download original delivery
        uses: actions/download-artifact@v4
        with:
          name: 2026-09-10_DMP_336A_1599円反発と独自材料-delivery
          path: source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34451054993

      - name: Correct true peak only
        shell: bash
        run: |
          set -euo pipefail
          test -f source/final_video.mp4
          test -f source/publish_metadata.json
          ffmpeg -y -i source/final_video.mp4 \
            -af "loudnorm=I=-15:LRA=7:TP=-1.5" \
            -map 0:v:0 -map 0:a:0 \
            -c:v copy -c:a aac -b:a 128k -ar 48000 -ac 2 \
            -movflags +faststart corrected_video.mp4

      - name: Verify corrected media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p corrected
          ffprobe -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels \
            -of json corrected_video.mp4 > corrected/media_info.json
          ffmpeg -v error -i corrected_video.mp4 -f null - 2> corrected/decode-errors.txt
          test ! -s corrected/decode-errors.txt
          ffmpeg -hide_banner -i corrected_video.mp4 \
            -af loudnorm=I=-15:LRA=7:TP=-1:print_format=json \
            -f null - 2> corrected/loudness_raw.txt || true
          python - <<'PY'
          import json,re
          text=open('corrected/loudness_raw.txt',encoding='utf-8',errors='ignore').read()
          matches=re.findall(r'\{\s*"input_i".*?\}',text,re.S)
          if not matches:
              raise SystemExit('Could not parse loudness measurement')
          data=json.loads(matches[-1])
          i=float(data['input_i']); tp=float(data['input_tp'])
          open('corrected/loudness.txt','w',encoding='utf-8').write(f'integrated_lufs={i}\ntrue_peak_dbtp={tp}\n')
          if not (-16.0 <= i <= -14.0):
              raise SystemExit(f'Integrated loudness out of range: {i}')
          if tp > -1.0:
              raise SystemExit(f'True peak exceeds master target: {tp}')
          print(f'master loudness QA passed: I={i}, TP={tp}')
          PY

      - name: Upload corrected private draft to YouTube
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPLOAD_POST_API_KEY"
          test -n "$UPLOAD_POST_USER"
          node remotion-video/upload-post-youtube.mjs \
            corrected_video.mp4 \
            source/publish_metadata.json \
            corrected/youtube_upload.json

      - name: Verify corrected YouTube draft
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('corrected/youtube_upload.json',encoding='utf-8'))
          assert d['video_id']
          assert d['privacy_status']=='private', d
          assert d['contains_synthetic_media'] is True, d
          assert d['description_set'] is True, d
          assert d['tag_count'] > 0, d
          print('video_id='+d['video_id'])
          print('studio_edit_url='+d['studio_edit_url'])
          PY

      - name: Assemble corrected delivery
        shell: bash
        run: |
          cp corrected_video.mp4 corrected/final_video.mp4
          cp source/publish_metadata.json corrected/
          cp source/description.txt corrected/ || true
          cp source/tags.txt corrected/ || true
          cp source/titles.txt corrected/ || true
          cp source/x_post.txt corrected/ || true

      - name: Upload corrected delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2026-09-10_DMP_336A_1599円反発と独自材料-delivery-tpfix
          path: corrected/
          retention-days: 7
          compression-level: 0
