name: Run Kioxia 20260912

on:
  push:
    branches:
      - remotion-prototype
    paths:
      - '.github/workflows/run-kioxia-20260912.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch direct YouTube video pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${{ github.repository }}/actions/workflows/video-pipeline-youtube-direct.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "remotion-prototype",
            "inputs": {
              "project_key": "kioxia-20260912",
              "video_plan_file_id": "1Wz2i1s_sne-IyjHUYw38z93L5e5GFWwe",
              "slides_folder_id": "1c-LCqx_0WYLV7eARIx085UNKMG21LD8U",
              "audio_folder_id": "1Q_Qdi1z3Cem9YSttcVDlUWz0NDgiuKC3",
              "audio_manifest_file_id": "1sBzqvAhvv4qocS3QhA0neLw1EEmDOB6r",
              "ending_slide_file_id": "1E_g376FHQOt0M7c6gAJAjpNOCnKVpj0k",
              "output_filename": "kioxia-sandisk-offhours-20260912.mp4",
              "segment_count": "12"
            }
          }
          JSON
          echo "dispatch requested"
