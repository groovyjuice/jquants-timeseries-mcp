name: Export Kura Sushi Full Video

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/export-kurazushi-full.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for rendered project video
        shell: bash
        run: |
          set -u
          URL="https://remotion-video-prototype.onrender.com/project-output.mp4"
          OUT="kurazushi_chiikawa_full.mp4"

          for i in $(seq 1 100); do
            echo "Attempt $i"
            CODE=$(curl -L -sS --max-time 60 -o candidate.bin -w "%{http_code}" "$URL" || true)
            SIZE=$(stat -c%s candidate.bin 2>/dev/null || echo 0)
            MIME=$(file -b --mime-type candidate.bin 2>/dev/null || echo unknown)
            echo "HTTP=$CODE size=$SIZE mime=$MIME"

            if [ "$CODE" = "200" ] && [ "$SIZE" -gt 1000000 ] && [ "$MIME" = "video/mp4" ]; then
              mv candidate.bin "$OUT"
              echo "Video ready."
              exit 0
            fi

            rm -f candidate.bin
            sleep 30
          done

          echo "Timed out waiting for project video."
          exit 1

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: kurazushi-full-video
          path: kurazushi_chiikawa_full.mp4
          retention-days: 7
