services:
  - type: web
    name: jquants-timeseries-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: JQUANTS_API_KEY
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: MCP_ACCESS_TOKEN
        generateValue: true
